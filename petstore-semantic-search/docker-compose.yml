services:
  web:
    build: .
    container_name: petstore-backend
    ports:
      - "8001:8000"
    depends_on:
      - db
      - qdrant
    environment:
      DATABASE_URL: postgresql://petstore:petstore123@db:5432/petstoredb
      # Optional: force Hugging Face to use offline mode
      HF_HUB_OFFLINE: "1"
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: petstore-db
    restart: always
    environment:
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore123
      POSTGRES_DB: petstoredb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: petstore-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@petstore.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: petstore-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
    postgres_data:
    qdrant_data:      